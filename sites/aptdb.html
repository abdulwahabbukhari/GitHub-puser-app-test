<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT313DB - Database Lookup</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(6, 182, 212, 0.3);
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-cyan-500 selection:text-white">

    <!-- Background Glow Orbs -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>

    <!-- Header Section -->
    <header class="w-full py-6 px-6 border-b border-slate-800/60 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-database text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500 bg-clip-text text-transparent">APT313DB</h1>
                <p class="text-xs text-slate-400 font-medium">Advanced Query Lookup</p>
            </div>
        </div>
        <div class="hidden sm:flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span class="text-xs text-slate-300 font-semibold tracking-wide">Owner: <span class="text-cyan-400">MR SILENT</span></span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 z-10">
        <div class="w-full max-w-lg">
            
            <!-- Hero Title -->
            <div class="text-center mb-8">
                <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2">Number Verification</h2>
                <p class="text-slate-400 text-sm">Enter mobile number starting with <span class="text-cyan-400 font-mono">03...</span> or <span class="text-cyan-400 font-mono">92...</span></p>
            </div>

            <!-- Search Box Card -->
            <div class="glass-card rounded-2xl p-6 glow-effect mb-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Phone Number</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                                <i class="fa-solid fa-phone"></i>
                            </span>
                            <input type="text" id="phoneInput" placeholder="e.g. 03001234567 or 923001234567" 
                                class="w-full pl-11 pr-4 py-3.5 bg-slate-900/90 border border-slate-700/70 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all mono-font text-sm">
                        </div>
                    </div>
                    <button onclick="fetchData()" id="searchBtn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/25 transition-all transform active:scale-[0.99] flex items-center justify-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                        <span id="btnText">Search Database</span>
                    </button>
                </div>
            </div>

            <!-- Result Card Container (Single Stylish Card) -->
            <div id="resultContainer" class="hidden glass-card rounded-2xl p-6 border border-cyan-500/30 transition-all duration-300">
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-id-card text-cyan-400"></i>
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300">Record Found</h3>
                    </div>
                    <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2.5 py-1 rounded-md font-mono">APT313-VERIFIED</span>
                </div>

                <!-- Dynamic Info Rows -->
                <div id="resultContent" class="space-y-3">
                    <!-- Data injected via JS -->
                </div>
            </div>

            <!-- Error / Empty State Box -->
            <div id="messageBox" class="hidden glass-card rounded-xl p-4 text-center text-rose-400 border border-rose-500/20 text-sm">
                <i class="fa-solid fa-triangle-exclamation mr-2"></i><span id="messageText">No record found or invalid number.</span>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        APT313DB &bull; Developed with Precision by <span class="text-cyan-400 font-semibold">MR SILENT</span>
    </footer>

    <!-- Script Logic -->
    <script>
        async function fetchData() {
            let inputVal = document.getElementById('phoneInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            const messageBox = document.getElementById('messageBox');
            const searchBtn = document.getElementById('searchBtn');
            const searchIcon = document.getElementById('searchIcon');
            const btnText = document.getElementById('btnText');

            if (!inputVal) {
                showError("Please enter a valid mobile number.");
                return;
            }

            // Hide previous results/errors & show loading state
            resultContainer.classList.add('hidden');
            messageBox.classList.add('hidden');
            searchBtn.disabled = true;
            searchIcon.className = "fa-solid fa-spinner fa-spin";
            btnText.innerText = "Searching...";

            try {
                // API Call
                const response = await fetch(`https://ft-simdb.ftshehryar10044.workers.dev/ft/api?num=${encodeURIComponent(inputVal)}`);
                const data = await response.json();

                // Check if data exists or valid response format
                if (data && (data.success || data.status || Object.keys(data).length > 0)) {
                    renderResult(data);
                } else {
                    showError("No data found for this number.");
                }
            } catch (err) {
                showError("Network error or API is down. Try again later.");
            } finally {
                searchBtn.disabled = false;
                searchIcon.className = "fa-solid fa-magnifying-glass";
                btnText.innerText = "Search Database";
            }
        }

        function renderResult(data) {
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = "";

            // Flatten or iterate through JSON fields dynamically and stylishly
            // Giving special focus to CNIC and Phone if they exist
            let html = "";
            
            // Handle if API returns an object or array wrapper
            let record = data.data || data.result || data;
            if (Array.isArray(record)) record = record[0];

            if (!record || typeof record !== 'object') {
                showError("Invalid response format received.");
                return;
            }

            for (const [key, value] of Object.entries(record)) {
                if (value !== null && value !== undefined && value !== "") {
                    let formattedKey = key.replace(/_/g, ' ').toUpperCase();
                    let isCnic = key.toLowerCase().includes('cnic');
                    let isPhone = key.toLowerCase().includes('phone') || key.toLowerCase().includes('number');

                    html += `
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-2 px-3 rounded-xl bg-slate-900/60 border border-slate-800/80">
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${formattedKey}</span>
                            <span class="text-sm font-medium ${isCnic ? 'text-cyan-400 font-mono tracking-wider font-bold' : isPhone ? 'text-emerald-400 font-mono' : 'text-slate-200'} mt-1 sm:mt-0">${value}</span>
                        </div>
                    `;
                }
            }

            if(html === "") {
                showError("No detailed records found.");
                return;
            }

            resultContent.innerHTML = html;
            resultContainer.classList.remove('hidden');
        }

        function showError(msg) {
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            messageText.innerText = msg;
            messageBox.classList.remove('hidden');
        }

        // Allow Enter key press to search
        document.getElementById('phoneInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchData();
            }
        });
    </script>
</body>
</html>
