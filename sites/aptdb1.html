<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APT313DB - Rose Gold Executive Edition</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<!-- html2pdf.js for Professional PDF Generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
body {
font-family: 'Plus Jakarta Sans', sans-serif;
background-color: #0c0a09;
color: #f5f5f4;
}
.mono-font {
font-family: 'JetBrains Mono', monospace;
}
/* Rose Gold Glassmorphism */
.glass-rose {
background: linear-gradient(135deg, rgba(28, 20, 20, 0.85), rgba(15, 12, 12, 0.9));
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(225, 172, 150, 0.15);
}
.rose-glow {
box-shadow: 0 0 50px -10px rgba(225, 172, 150, 0.2);
}
.card-rose-glow:hover {
border-color: rgba(225, 172, 150, 0.4);
box-shadow: 0 0 35px -5px rgba(225, 172, 150, 0.18);
}
.rose-gradient-text {
background: linear-gradient(135deg, #fff1eb 0%, #e1ac96 50%, #b76e79 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
.rose-btn-gradient {
background: linear-gradient(135deg, #e1ac96 0%, #b76e79 100%);
}
.rose-btn-gradient:hover {
background: linear-gradient(135deg, #f0bfa9 0%, #c57884 100%);
}
/* 8 Custom Animations */
@keyframes floatOrb1 {
0%, 100% { transform: translateY(0px) translateX(0px) scale(1); }
50% { transform: translateY(-30px) translateX(20px) scale(1.05); }
}
@keyframes floatOrb2 {
0%, 100% { transform: translateY(0px) translateX(0px) scale(1); }
50% { transform: translateY(30px) translateX(-20px) scale(1.1); }
}
@keyframes shimmer {
0% { background-position: -200% 0; }
100% { background-position: 200% 0; }
}
@keyframes cardPopIn {
0% { opacity: 0; transform: translateY(25px) scale(0.97); }
100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pulseGlow {
0%, 100% { opacity: 0.3; }
50% { opacity: 0.7; }
}
@keyframes borderRotate {
0% { border-color: rgba(225, 172, 150, 0.15); }
50% { border-color: rgba(225, 172, 150, 0.45); }
100% { border-color: rgba(225, 172, 150, 0.15); }
}
@keyframes iconBounce {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-4px); }
}
@keyframes rippleEffect {
0% { box-shadow: 0 0 0 0 rgba(225, 172, 150, 0.4); }
70% { box-shadow: 0 0 0 15px rgba(225, 172, 150, 0); }
100% { box-shadow: 0 0 0 0 rgba(225, 172, 150, 0); }
}
.anim-orb-1 { animation: floatOrb1 8s ease-in-out infinite; }
.anim-orb-2 { animation: floatOrb2 10s ease-in-out infinite; }
.anim-card-pop { animation: cardPopIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.anim-pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
.anim-border { animation: borderRotate 6s ease-in-out infinite; }
.anim-icon:hover { animation: iconBounce 0.6s ease infinite; }
.anim-ripple { animation: rippleEffect 2s infinite; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-[#b76e79] selection:text-white">
<!-- Background Animated Glow Orbs -->
<div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-[#b76e79]/10 rounded-full blur-[140px] pointer-events-none anim-orb-1"></div>
<div class="absolute bottom-10 right-1/4 w-[500px] h-[500px] bg-[#e1ac96]/10 rounded-full blur-[140px] pointer-events-none anim-orb-2"></div>
<!-- Header Section -->
<header class="w-full py-5 px-6 sm:px-12 border-b border-[#e1ac96]/15 backdrop-blur-xl sticky top-0 z-50 flex justify-between items-center bg-[#0c0a09]/80">
<div class="flex items-center space-x-3">
<div class="w-11 h-11 rounded-2xl rose-btn-gradient flex items-center justify-center shadow-lg shadow-[#b76e79]/30 anim-icon">
<i class="fa-solid fa-fingerprint text-white text-xl"></i>
</div>
<div>
<h1 class="text-xl font-black tracking-wider rose-gradient-text">APT313DB</h1>
<p class="text-[11px] text-[#e1ac96]/70 font-semibold uppercase tracking-widest">Rose Gold Intelligence</p>
</div>
</div>
<div class="flex items-center space-x-3 bg-[#1c1414]/90 border border-[#e1ac96]/20 px-4 py-2 rounded-full shadow-inner anim-border">
<span class="w-2.5 h-2.5 rounded-full bg-[#e1ac96] anim-ripple"></span>
<span class="text-xs text-stone-200 font-bold tracking-wide">Owner: <span class="text-[#e1ac96] font-extrabold tracking-wider">MR SILENT</span></span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center px-4 py-12 z-10 w-full max-w-3xl mx-auto">
<!-- Hero Title -->
<div class="text-center mb-10">
<div class="inline-flex items-center space-x-2 px-3.5 py-1 rounded-full bg-[#b76e79]/10 border border-[#e1ac96]/25 text-[#e1ac96] text-xs font-semibold mb-3 anim-pulse-glow">
<i class="fa-solid fa-gem text-xs"></i>
<span>Exclusive Rose Gold Terminal</span>
</div>
<h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-3 rose-gradient-text">Advanced Number Lookup</h2>
<p class="text-stone-400 text-sm max-w-md mx-auto">Input phone number starting with <span class="text-[#e1ac96] font-mono">03...</span> or country format <span class="text-[#e1ac96] font-mono">92...</span></p>
</div>
<!-- Search Box Card -->
<div class="glass-rose rounded-2xl p-6 rose-glow w-full mb-8 anim-border">
<div class="flex flex-col sm:flex-row gap-3">
<div class="relative flex-grow">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#e1ac96]/60">
<i class="fa-solid fa-phone-volume"></i>
</span>
<input type="text" id="phoneInput" placeholder="e.g. 03023336116 or 923023336116" 
class="w-full pl-11 pr-4 py-4 bg-stone-900/90 border border-[#e1ac96]/20 rounded-xl text-stone-100 placeholder-stone-500 focus:outline-none focus:border-[#e1ac96] focus:ring-2 focus:ring-[#e1ac96]/20 transition-all mono-font text-sm font-medium">
</div>
<button onclick="fetchData()" id="searchBtn" class="px-8 py-4 rose-btn-gradient text-stone-950 font-extrabold rounded-xl shadow-lg shadow-[#b76e79]/30 transition-all transform active:scale-[0.98] flex items-center justify-center space-x-2 cursor-pointer shrink-0">
<i class="fa-solid fa-radar" id="searchIcon"></i>
<span id="btnText">Search Database</span>
</button>
</div>
</div>
<!-- Result Control & PDF Download Action Bar -->
<div id="resultsMeta" class="w-full hidden mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 px-2">
<div class="flex items-center space-x-2">
<span class="text-xs uppercase tracking-widest text-stone-400 font-bold">Records Found: <span id="recordCount" class="text-[#e1ac96] font-mono">0</span></span>
<span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">VERIFIED</span>
</div>
<!-- PDF Download Button -->
<button onclick="downloadPDF()" class="px-4 py-2 bg-stone-900 hover:bg-stone-800 border border-[#e1ac96]/40 text-[#e1ac96] rounded-xl text-xs font-bold tracking-wider flex items-center space-x-2 transition-all cursor-pointer shadow-md anim-icon">
<i class="fa-solid fa-file-pdf text-rose-400 text-sm"></i>
<span>Download Professional PDF</span>
</button>
</div>
<!-- Printable & Interactive Result Cards Container -->
<div id="pdfExportArea" class="w-full space-y-4">
<!-- Dynamic Cards injected here -->
</div>
<!-- Error / Empty State Box -->
<div id="messageBox" class="hidden w-full glass-rose rounded-2xl p-6 text-center text-rose-300 border border-rose-500/30 text-sm">
<div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center mx-auto mb-3 text-lg">
<i class="fa-solid fa-triangle-exclamation"></i>
</div>
<p id="messageText" class="font-semibold text-stone-200">No records found or invalid query.</p>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-5 text-center text-xs text-stone-500 border-t border-[#e1ac96]/10 bg-[#0c0a09]/50">
APT313DB • Crafted in Rose Gold Theme by <span class="text-[#e1ac96] font-bold">MR SILENT</span>
</footer>
<!-- Script Logic -->
<script>
let latestRecordsData = [];
async function fetchData() {
let inputVal = document.getElementById('phoneInput').value.trim();
const resultContainer = document.getElementById('pdfExportArea');
const resultsMeta = document.getElementById('resultsMeta');
const messageBox = document.getElementById('messageBox');
const searchBtn = document.getElementById('searchBtn');
const searchIcon = document.getElementById('searchIcon');
const btnText = document.getElementById('btnText');
if (!inputVal) {
showError("Please enter a valid mobile number.");
return;
}
// Reset UI states
resultContainer.innerHTML = "";
resultsMeta.classList.add('hidden');
messageBox.classList.add('hidden');
searchBtn.disabled = true;
searchIcon.className = "fa-solid fa-spinner fa-spin";
btnText.innerText = "Querying Database...";
try {
const response = await fetch(https://ft-simdb.ftshehryar10044.workers.dev/ft/api?num=${encodeURIComponent(inputVal)});
const data = await response.json();
if (data && data.status === "success" && data.records && data.records.length > 0) {
latestRecordsData = data.records;
renderRecords(data.records, data.count || data.records.length);
} else {
showError("No database matches found for this query.");
}
} catch (err) {
showError("Network connection error or API endpoint timeout.");
} finally {
searchBtn.disabled = false;
searchIcon.className = "fa-solid fa-radar";
btnText.innerText = "Search Database";
}
}
function renderRecords(records, count) {
const resultContainer = document.getElementById('pdfExportArea');
const resultsMeta = document.getElementById('resultsMeta');
const recordCountSpan = document.getElementById('recordCount');
recordCountSpan.innerText = count;
resultsMeta.classList.remove('hidden');
let html = "";
records.forEach((rec, index) => {
html += `
<div class="glass-rose rounded-2xl p-6 card-rose-glow transition-all duration-300 border border-[#e1ac96]/20 relative overflow-hidden anim-card-pop" style="animation-delay: ${index * 0.1}s;">
<!-- Top Index Badge -->
<div class="absolute top-0 right-0 bg-gradient-to-l from-[#b76e79]/25 to-transparent px-4 py-1.5 rounded-bl-2xl border-l border-b border-[#e1ac96]/30">
<span class="text-[10px] font-mono font-bold text-[#e1ac96] uppercase tracking-widest">RECORD #${index + 1}</span>
</div>
<div class="space-y-4 pt-2">
<!-- Name Field -->
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-2.5 px-4 rounded-xl bg-stone-900/60 border border-[#e1ac96]/10">
<span class="text-xs font-semibold text-stone-400 uppercase tracking-wider flex items-center space-x-2">
<i class="fa-solid fa-user text-[#e1ac96] w-4"></i>
<span>Full Name</span>
</span>
<span class="text-sm font-bold text-white mt-1 sm:mt-0 tracking-wide">${rec.name || 'N/A'}</span>
</div>
<!-- Mobile & Network Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<div class="flex flex-col justify-between py-2.5 px-4 rounded-xl bg-stone-900/60 border border-[#e1ac96]/10">
<span class="text-xs font-semibold text-stone-400 uppercase tracking-wider flex items-center space-x-2 mb-1">
<i class="fa-solid fa-mobile-screen text-emerald-400 w-4"></i>
<span>Mobile Number</span>
</span>
<span class="text-sm font-bold text-emerald-400 mono-font tracking-wider">{rec.mobile || 'N/A'}</span>
</div>
<div class="flex flex-col justify-between py-2.5 px-4 rounded-xl bg-stone-900/60 border border-[#e1ac96]/10">
<span class="text-xs font-semibold text-stone-400 uppercase tracking-wider flex items-center space-x-2 mb-1">
<i class="fa-solid fa-tower-broadcast text-sky-400 w-4"></i>
<span>Network Provider</span>
</span>
<span class="text-sm font-bold text-sky-300 tracking-wide">{rec.network || 'N/A'}</span>
</div>
</div>
<!-- CNIC Field -->
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-2.5 px-4 rounded-xl bg-stone-900/60 border border-[#e1ac96]/10">
<span class="text-xs font-semibold text-stone-400 uppercase tracking-wider flex items-center space-x-2">
<i class="fa-solid fa-id-card text-amber-400 w-4"></i>
<span>CNIC Number</span>
</span>
<span class="text-sm font-bold text-amber-300 mono-font tracking-widest mt-1 sm:mt-0">${rec.cnic || 'N/A'}</span>
</div>
<!-- Address Field -->
<div class="flex flex-col py-2.5 px-4 rounded-xl bg-stone-900/60 border border-[#e1ac96]/10">
<span class="text-xs font-semibold text-stone-400 uppercase tracking-wider flex items-center space-x-2 mb-1">
<i class="fa-solid fa-location-dot text-rose-400 w-4"></i>
<span>Registered Address</span>
</span>
<span class="text-xs sm:text-sm font-medium text-stone-300 leading-relaxed">${rec.address || 'N/A'}</span>
</div>
</div>
</div>
`;
});
resultContainer.innerHTML = html;
}
function showError(msg) {
const messageBox = document.getElementById('messageBox');
const messageText = document.getElementById('messageText');
messageText.innerText = msg;
messageBox.classList.remove('hidden');
}
// Professional PDF Generation Function
function downloadPDF() {
if (!latestRecordsData || latestRecordsData.length === 0) return;
// Create a clean temporary element structured specifically for professional PDF styling
const container = document.createElement('div');
container.style.padding = '30px';
container.style.backgroundColor = '#ffffff';
container.style.color = '#1c1917';
container.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
let htmlContent = <div style="border-bottom: 3px solid #b76e79; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;"> <div> <h1 style="font-size: 24px; font-weight: 800; color: #b76e79; margin: 0;">APT313DB REPORT</h1> <p style="font-size: 11px; color: #78716c; margin: 4px 0 0 0; text-transform: uppercase; letter-spacing: 1px;">Official Intelligence Dossier &bull; Owner: MR SILENT</p> </div> <div style="text-align: right; font-size: 10px; color: #78716c;"> <strong>Generated:</strong> ${new Date().toLocaleString()}<br> <strong>Status:</strong> Verified Secure </div> </div> <div style="space-y: 15px;">;
latestRecordsData.forEach((rec, idx) => {
htmlContent += <div style="border: 1px solid #e7e5e4; border-radius: 10px; padding: 18px; margin-bottom: 15px; background-color: #fafaf9;"> <div style="font-size: 11px; font-weight: bold; color: #b76e79; margin-bottom: 8px; text-transform: uppercase;">Record Entry #${idx + 1}</div> <table style="width: 100%; font-size: 12px; border-collapse: collapse;"> <tr> <td style="padding: 6px 0; color: #78716c; width: 30%; font-weight: 600;">FULL NAME:</td> <td style="padding: 6px 0; color: #1c1917; font-weight: 700;">${rec.name || 'N/A'}</td> </tr> <tr> <td style="padding: 6px 0; color: #78716c; font-weight: 600;">MOBILE NUMBER:</td> <td style="padding: 6px 0; color: #059669; font-family: monospace; font-weight: 700;">${rec.mobile || 'N/A'}</td> </tr> <tr> <td style="padding: 6px 0; color: #78716c; font-weight: 600;">NETWORK:</td> <td style="padding: 6px 0; color: #0284c7; font-weight: 700;">${rec.network || 'N/A'}</td> </tr> <tr> <td style="padding: 6px 0; color: #78716c; font-weight: 600;">CNIC NUMBER:</td> <td style="padding: 6px 0; color: #d97706; font-family: monospace; font-weight: 700;">${rec.cnic || 'N/A'}</td> </tr> <tr> <td style="padding: 6px 0; color: #78716c; font-weight: 600; vertical-align: top;">ADDRESS:</td> <td style="padding: 6px 0; color: #44403c; line-height: 1.4;">${rec.address || 'N/A'}</td> </tr> </table> </div>;
});
htmlContent += </div> <div style="margin-top: 30px; text-align: center; font-size: 9px; color: #a8a29e; border-top: 1px solid #e7e5e4; paddingTop: 10px;"> Confidential Report &bull; APT313DB &bull; Powered by MR SILENT </div> ;
container.innerHTML = htmlContent;
const opt = {
margin:       10,
filename:     APT313DB_Report_${Date.now()}.pdf,
image:        { type: 'jpeg', quality: 0.98 },
html2canvas:  { scale: 2, useCORS: true },
jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
};
html2pdf().from(container).set(opt).save();
}
// Allow pressing Enter key to trigger search
document.getElementById('phoneInput').addEventListener('keypress', function (e) {
if (e.key === 'Enter') {
fetchData();
}
});
</script>
</body>
</html>
